[project]
name = "yool_theme"
authors = [
    { name = "Yooltech", email = "user@example.com"}
]
description = "Figma (UI-dinsg, Side Menu 10450:5374) theme for Desk, Helpdesk, CRM and portal sidebars"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
